name: Python Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run database-independent tests
        run: python -m pytest -q -m "not integration"

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5433"
      POSTGRES_DB: financial_market_test
      POSTGRES_USER: ci_test_user
      POSTGRES_PASSWORD: ci_only_temporary_password
      TWELVE_DATA_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Create isolated Docker network
        run: docker network create financial-market-shared

      - name: Start isolated PostgreSQL 17
        run: docker compose up -d --wait postgres

      - name: Verify test database identity
        run: |
          docker compose exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -At -c "SELECT current_database();" \
            | grep -Fx "$POSTGRES_DB"

      - name: Initialize migration history
        run: |
          python -c "from scripts.manage_migrations import initialize_migration_history, validate_migration_history; initialize_migration_history('financial_market_test'); validate_migration_history('financial_market_test')"

      - name: Apply Gold schema migrations
        run: |
          python scripts/manage_migrations.py apply \
            --database financial_market_test

      - name: Verify migration status
        run: |
          python scripts/manage_migrations.py status \
            --database financial_market_test

      - name: Create isolated migration-test database
        run: |
          docker compose exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 \
            -U "$POSTGRES_USER" \
            -d postgres \
            -c "CREATE DATABASE financial_market_migration_test;"

      - name: Initialize migration-test database history
        run: |
          python -c "from scripts.manage_migrations import initialize_migration_history, validate_migration_history; initialize_migration_history('financial_market_migration_test'); validate_migration_history('financial_market_migration_test')"

      - name: Apply migration-test database migrations
        run: |
          python scripts/manage_migrations.py apply \
            --database financial_market_migration_test

      - name: Verify migration-test database status
        run: |
          python scripts/manage_migrations.py status \
            --database financial_market_migration_test

      - name: Run PostgreSQL integration tests
        run: python -m pytest -q -m integration

      - name: Clean up isolated database
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker network rm financial-market-shared || true

  airflow-smoke:
    name: Offline Airflow DAG smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build supported Airflow runtime
        run: docker build -f Dockerfile.airflow -t financial-market-airflow-smoke:ci .

      - name: Validate DAG offline using Airflow 3
        run: |
          docker run --rm --network none \
            --entrypoint python \
            -e PYTHONPATH=/opt/financial-data/src \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e ENABLE_TWELVE_DATA_INGESTION=false \
            -e ENABLE_GOLD_LOADING=false \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/src:/opt/financial-data/src:ro" \
            -v "$PWD/scripts:/opt/financial-data/scripts:ro" \
            financial-market-airflow-smoke:ci \
            /opt/financial-data/scripts/validate_airflow_dag.py

  dashboard-smoke:
    name: Offline Streamlit dashboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "1"
      POSTGRES_DB: financial_market_test
      POSTGRES_USER: offline_smoke
      POSTGRES_PASSWORD: offline_smoke_dummy
      PGCONNECT_TIMEOUT: "2"
      ENABLE_TWELVE_DATA_INGESTION: "false"
      ENABLE_GOLD_LOADING: "false"
      TWELVE_DATA_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dashboard runtime
        run: python -m pip install -e ".[dashboard]"

      - name: Execute all four pages with Streamlit AppTest
        run: python scripts/smoke_dashboard.py

      - name: Verify HTTP server startup and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run src/financial_data_platform/dashboard/app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --browser.gatherUsageStats false \
            > "$RUNNER_TEMP/streamlit-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:8501/_stcore/health \
              > /dev/null 2>/dev/null; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "Streamlit failed to become healthy"
            sed -n '1,80p' "$RUNNER_TEMP/streamlit-smoke.log"
            exit 1
          fi
          echo "PASS: Streamlit HTTP server reports healthy"
