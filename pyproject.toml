[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-market-data-platform"
version = "0.1.0"
description = "Cloud-native ETL pipeline for financial market analytics"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "pyarrow>=18,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring external services such as PostgreSQL",
]